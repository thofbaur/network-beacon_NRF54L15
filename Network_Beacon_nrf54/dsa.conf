# DSA project-specific build configuration.

# Development-only synthetic data generation lives in dsa_dev.conf and is
# not included here. Add it explicitly for test builds only, e.g.:
#   west build ... -- -DEXTRA_CONF_FILE="dsa_dev.conf"

CONFIG_DSA_LED_BLINK_ON_MS=30
CONFIG_DSA_SELF_REPORT_LED_ON_MS=2000

CONFIG_DSA_NETWORK_RING_COUNT=24000
CONFIG_DSA_NETWORK_STATUS_UPDATE_DELAY_MS=300
CONFIG_DSA_NETWORK_FLUSH_THRESHOLD=23500
CONFIG_DSA_NETWORK_FLASH_SIZE_BYTES=0xf1000

CONFIG_DSA_NUS_IDLE_TIMEOUT_MS=20000

CONFIG_DSA_SELF_REPORT_LONG_PRESS_MS=3000
CONFIG_DSA_SELF_REPORT_RING_COUNT=256
CONFIG_DSA_SELF_REPORT_FLUSH_THRESHOLD=230
CONFIG_DSA_SELF_REPORT_FLASH_SIZE_BYTES=0x2000
CONFIG_DSA_SELF_REPORT_FLUSH_BATCH=64
CONFIG_DSA_SELF_REPORT_FLUSH_RETRY_MS=5000

CONFIG_DSA_MOTION_DEFAULT_ACTIVE=y
CONFIG_DSA_MOTION_INACTIVITY_TIMEOUT_S=3600

CONFIG_DSA_ECO_LOG_RING_COUNT=64
CONFIG_DSA_ECO_LOG_FLUSH_THRESHOLD=32
CONFIG_DSA_ECO_LOG_FLASH_SIZE_BYTES=0x2000
CONFIG_DSA_ECO_LOG_FLUSH_BATCH=16
CONFIG_DSA_ECO_LOG_FLUSH_RETRY_MS=5000

CONFIG_DSA_DEV_ECO_LED_INDICATOR=n
