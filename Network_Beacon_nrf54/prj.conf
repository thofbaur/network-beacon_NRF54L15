CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
# Disabled for production: the advertised status byte (device.h/
# common_include.h, redesigned 2026-08-09 - see DECISIONS.md) is the
# diagnostic channel for a fielded tag, not the console. Re-enable all four
# for bench debugging if needed.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BT_FILTER_ACCEPT_LIST=y
# Requested size 256; the SoftDevice Controller's BT_CTLR_FAL_SIZE field
# range is "0 255", so 255 is the actual maximum.
CONFIG_BT_CTLR_FAL_SIZE=255
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=2
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x2000
# nRF54L15 has no Zephyr system-PM implementation. Device PM and tickless
# kernel idle are the supported low-power mechanisms for this target.
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y

# ADXL367 motion sensor for inactivity detection. Only present on the
# nrf54l15tag board; motion.c degrades gracefully when it's absent (e.g.
# the plain nrf54l15dk used for bench debugging).
CONFIG_SENSOR=y
CONFIG_ADXL367_TRIGGER_GLOBAL_THREAD=y
CONFIG_ADXL367_INACTIVITY_DETECTION_MODE=n
# The nrf54l15tag board also carries a BME680 and BMI270 that CONFIG_SENSOR
# auto-enables by default; this firmware doesn't use either.
CONFIG_BME680=n
CONFIG_BMI270=n
