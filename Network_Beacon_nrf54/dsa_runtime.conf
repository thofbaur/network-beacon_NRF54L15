# Defaults for parameters that can be changed at runtime and persisted.

CONFIG_DSA_DEFAULT_LED_ACTIVE=n
CONFIG_DSA_LED_BLINK_INTERVAL_MS=20000

# Eco mode has no entry path other than motion.c's inactivity timer, so
# this is the availability switch for eco mode as a whole - not just
# whether the accelerometer is watched. Runtime-controllable via
# P_MOTION_ACTIVE, persisted by motion_params_save()/motion_params_load().
CONFIG_DSA_MOTION_DEFAULT_ACTIVE=n

CONFIG_DSA_NETWORK_DEFAULT_RSSI_THRESHOLD=80
CONFIG_DSA_NETWORK_DEFAULT_RSSI_THRESHOLD_LOCATION=100
CONFIG_DSA_NETWORK_DEFAULT_TRACKING_ACTIVE=y

CONFIG_DSA_ADV_INTERVAL_MIN_MS=90
CONFIG_DSA_ADV_INTERVAL_MAX_MS=120
CONFIG_DSA_SCAN_WINDOW_MS=120
CONFIG_DSA_SCAN_INTERVAL_MS=7000
CONFIG_DSA_ECO_ADV_INTERVAL_MIN_MS=90
CONFIG_DSA_ECO_ADV_INTERVAL_MAX_MS=120
CONFIG_DSA_ECO_SCAN_WINDOW_MS=100
CONFIG_DSA_RADIO_DEFAULT_HIGH_ACTIVITY=y
CONFIG_DSA_ECO_SCAN_INTERVAL_MS=300000
