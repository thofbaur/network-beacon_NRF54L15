# Development-only synthetic data generation for the DSA network beacon.
#
# Not included by the default build (see CMakeLists.txt / dsa.conf). Add
# this as an extra conf file for test builds only, e.g.:
#   west build -b nrf54l15dk/nrf54l15/cpuapp/ns -d build_debug --sysbuild . \
#       -- -DEXTRA_CONF_FILE="dsa_dev.conf"
#
# Do not include this file in production/release builds.

CONFIG_DSA_DEV_SYNTHETIC_CONTACTS=y
CONFIG_DSA_DEV_SYNTHETIC_CONTACT_COUNT=23699

CONFIG_DSA_DEV_SYNTHETIC_SELF_REPORTS=y
CONFIG_DSA_DEV_SYNTHETIC_SELF_REPORT_COUNT=2
