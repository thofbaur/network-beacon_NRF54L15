# Enable the UART driver
CONFIG_DSA_OUTPUT="UART"
CONFIG_DSA_OUTPUT_FORMAT_RAW=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# DMA-driven (EasyDMA/UARTE) TX for uart_output.c instead of blocking
# uart_poll_out(): frees the CPU during transmission so a large output
# burst can't stall BT notification processing behind it. See the comment
# on uart_output_flush() in uart_output.c.
CONFIG_UART_ASYNC_API=y
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y

# Enable the BLE stack with GATT Client configuration
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# BLE throughput / MTU negotiation
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Default is BT_MAX_CONN (1), giving only BT_MAX_CONN + 1 = 2 incoming ACL
# buffers total - the controller can hold almost nothing ahead of the host
# draining it. A beacon dumping a large contact backlog (hundreds-low
# thousands of entries, sent as fast as the link allows) can outrun that
# in a single burst; the beacon commits/drops each batch once its own send
# is confirmed, regardless of whether this host ever actually caught it,
# so an overrun here shows up as silently missing data, not an error.
# More headroom doesn't guarantee against an arbitrarily large burst, but
# it raises the burst size before backpressure/loss can start.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=16
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_TX_COUNT=6
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# Enable the BLE modules from NCS
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# This example requires more stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# Enable bonding
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Config logger
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y
