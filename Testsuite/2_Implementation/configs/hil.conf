# Test-only beacon configuration for the hardware tests (DK A).
# Used together with Network_Beacon_nrf54/dsa_dev.conf:
#   west build ... -- -DEXTRA_CONF_FILE="<repo>/Network_Beacon_nrf54/dsa_dev.conf;<this file>"
# Never use for production builds (E3 checks that).

# Console over RTT so the tests can read printk() output (prj.conf disables
# all console output for production).
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Small synthetic data set: a readout takes seconds, everything stays in RAM.
# Synthetic contact i (1-based) has id = i & 0xFF, timer = i, rssi 30..99.
CONFIG_DSA_DEV_SYNTHETIC_CONTACTS=y
CONFIG_DSA_DEV_SYNTHETIC_CONTACT_COUNT=500
CONFIG_DSA_DEV_SYNTHETIC_SELF_REPORTS=y
CONFIG_DSA_DEV_SYNTHETIC_SELF_REPORT_COUNT=10
