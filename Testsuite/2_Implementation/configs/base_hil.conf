# Test-only Base configuration for the hardware chain tests (DK B, role Base).
# Raw output over UART (prj.conf default), connect at any data level so a
# readout starts even with few contacts. The target beacon id is passed on the
# command line: -DCONFIG_DSA_TARGET_BEACON_ID=<DK A id>.
CONFIG_DSA_READOUT_LEVEL=1
