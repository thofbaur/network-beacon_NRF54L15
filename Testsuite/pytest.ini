[pytest]
# Run from Testsuite/ ("pytest"); the implementation lives in 2_Implementation/.
testpaths = 2_Implementation/tests
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    hil: hardware-in-the-loop test (needs --hil and connected development kits)
    ble: needs the computer's Bluetooth adapter
    two_dk: needs DK A and DK B
    tags: needs battery-powered tags in range (listed in 0_Environment/boards.toml)
    slow: long-running test (needs --slow)
    build: runs west builds (needs --run-builds and the nRF Connect SDK)
    manual: documented manual test, never automated
